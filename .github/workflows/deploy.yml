name: Build & Deploy to Starthost

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 5 * * *'  # Täglich um 6 Uhr (MEZ) = 5 UTC → Rebuild für pubDate-gesteuerte Artikel

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy via SFTP to Starthost
        run: |
          sudo apt-get install -y lftp
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "ssh.gb.stackcp.com" >> ~/.ssh/known_hosts 2>/dev/null
          lftp -e "
            set sftp:connect-program 'ssh -a -x -i ~/.ssh/id_ed25519';
            open sftp://fuerte.digital@ssh.gb.stackcp.com;
            set net:timeout 30;
            set net:max-retries 5;
            set net:reconnect-interval-base 5;
            mirror --reverse --delete --parallel=4 --verbose ./dist/ bonuskarte/;
            quit
          "
