name: Build & Deploy to Starthost

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 5 * * *'  # Täglich um 6 Uhr (MEZ) = 5 UTC → Rebuild für pubDate-gesteuerte Artikel

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy via FTP to Starthost
        run: |
          sudo apt-get install -y lftp
          lftp -u "${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }}" "${{ secrets.FTP_SERVER }}" -e "
            set ftp:ssl-allow no;
            set net:timeout 30;
            set net:max-retries 5;
            set net:reconnect-interval-base 5;
            mirror --reverse --delete --parallel=4 --verbose ./dist/ /bonuskarte/;
            quit
          "
