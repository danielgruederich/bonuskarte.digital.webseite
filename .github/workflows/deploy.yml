name: Build & Deploy to Starthost

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 5 * * *'  # Täglich um 6 Uhr (MEZ) = 5 UTC → Rebuild für pubDate-gesteuerte Artikel

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Deploy via SFTP → bonuskarte/
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          lftp -c "
            set sftp:connect-program 'ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null';
            set net:timeout 30;
            open -u fuerte.digital, sftp://ssh.gb.stackcp.com;
            mirror -R --verbose --delete --parallel=4 --exclude-glob .DS_Store dist/ bonuskarte/;
          "

          rm ~/.ssh/deploy_key
