name: Build & Deploy to Starthost

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'  # Täglich um 6 Uhr (MEZ) = 5 UTC → Rebuild für pubDate-gesteuerte Artikel

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: ZIP dist
        run: cd dist && zip -r ../site.zip . -q && echo "ZIP size: $(du -sh ../site.zip | cut -f1)"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete deploy-latest --yes 2>/dev/null || true
          git push origin :refs/tags/deploy-latest 2>/dev/null || true
          gh release create deploy-latest site.zip \
            --title "Deploy $(date -u '+%Y-%m-%d %H:%M UTC')" \
            --notes "Automated deploy" \
            --prerelease

      - name: Trigger webhook
        run: |
          STATUS=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            "https://bonuskarte.digital/deploy.php?token=${{ secrets.DEPLOY_TOKEN }}")
          echo "Response: $(cat /tmp/resp.json)"
          [ "$STATUS" = "200" ] || (echo "Webhook failed — HTTP $STATUS" && exit 1)
