# Einmaliger Setup-Job: legt ~/bonuskarte-secrets.php auf dem Server an.
# Liest die aktuellen Werte aus public/api/submit.php auf main (dort stehen
# sie noch im Klartext) — es landen also KEINE Secret-Werte in diesem File
# oder in den Action-Logs. Nach erfolgreichem Lauf wird dieses File gelöscht.
name: Setup Server Secrets (einmalig)

on:
  workflow_dispatch:

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Secrets-Datei auf dem Server anlegen
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_KEY:-}" ]; then
            echo "::error::Secret SSH_PRIVATE_KEY fehlt im Repo — Datei muss manuell per SSH angelegt werden"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ssh.gb.stackcp.com >> ~/.ssh/known_hosts 2>/dev/null || true

          # Werte aus submit.php (Stand main) extrahieren — nichts davon loggen!
          val() { grep -m1 "const $1" public/api/submit.php | sed "s/.*= *'//; s/'.*//"; }
          BOOM=$(val BOOMERANG_API_KEY)
          SALES=$(val SALESFLARE_API_KEY)
          TG=$(val TELEGRAM_BOT_TOKEN)
          TGID=$(val TELEGRAM_CHAT_ID)
          SHEETS=$(val SHEETS_WEBHOOK_URL)
          MC=$(val MAILERCLOUD_API_KEY)
          for v in "$BOOM" "$SALES" "$TG" "$TGID" "$SHEETS" "$MC"; do
            if [ -z "$v" ]; then
              echo "::error::Konnte Werte nicht aus public/api/submit.php lesen"
              exit 1
            fi
          done

          printf "<?php\nreturn [\n    'boomerang_api_key'   => '%s',\n    'salesflare_api_key'  => '%s',\n    'telegram_bot_token'  => '%s',\n    'telegram_chat_id'    => '%s',\n    'sheets_webhook_url'  => '%s',\n    'mailercloud_api_key' => '%s',\n];\n" \
            "$BOOM" "$SALES" "$TG" "$TGID" "$SHEETS" "$MC" > /tmp/bonuskarte-secrets.php
          php -l /tmp/bonuskarte-secrets.php

          SSH_OPTS="-i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=accept-new"
          scp $SSH_OPTS /tmp/bonuskarte-secrets.php fuerte.digital@ssh.gb.stackcp.com:bonuskarte-secrets.php
          ssh $SSH_OPTS fuerte.digital@ssh.gb.stackcp.com 'bash -s' <<'REMOTE'
          set -e
          chmod 600 "$HOME/bonuskarte-secrets.php"
          echo "--- Datei angelegt:"
          ls -la "$HOME/bonuskarte-secrets.php"
          echo "--- Webroot-Layout (fuer Pfad-Check in submit.php):"
          ls -d "$HOME/bonuskarte/api" || { echo "FEHLER: ~/bonuskarte/api nicht gefunden - Pfad pruefen!"; exit 1; }
          php -r 'var_dump(is_array(require getenv("HOME")."/bonuskarte-secrets.php"));'
          REMOTE
