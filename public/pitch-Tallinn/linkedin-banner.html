<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; display: flex; align-items: center; justify-content: center; height: 100vh; }

  .banner {
    width: 1584px;
    height: 396px;
    background: linear-gradient(135deg, #0a0a0a 0%, #111 50%, #0f1a0f 100%);
    position: relative;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex;
    align-items: center;
    padding: 0 80px;
  }

  /* Köln Skyline silhouette */
  .skyline {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 300px;
  }
  .skyline svg {
    width: 100%;
    height: 100%;
  }

  /* Subtle grid pattern */
  .grid-pattern {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(34,197,94,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(34,197,94,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  /* Glow effects */
  .glow-1 {
    position: absolute;
    top: -60px;
    right: 200px;
    width: 400px;
    height: 200px;
    background: radial-gradient(ellipse, rgba(34,197,94,0.12), transparent 70%);
  }
  .glow-2 {
    position: absolute;
    bottom: -40px;
    left: 300px;
    width: 300px;
    height: 150px;
    background: radial-gradient(ellipse, rgba(34,197,94,0.08), transparent 70%);
  }

  .content {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 60px;
    width: 100%;
  }

  .text-block {
    flex: 1;
    /* Offset to the right to avoid profile photo overlap area */
    padding-left: 200px;
  }

  .brand {
    font-size: 48px;
    font-weight: 800;
    color: #fff;
    letter-spacing: -1px;
    margin-bottom: 8px;
  }
  .brand .dot { color: #22c55e; }

  .tagline {
    font-size: 22px;
    color: rgba(255,255,255,0.55);
    font-weight: 400;
    margin-bottom: 16px;
  }

  .badges {
    display: flex;
    gap: 16px;
  }
  .badge {
    padding: 6px 16px;
    border: 1px solid rgba(34,197,94,0.25);
    border-radius: 20px;
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(34,197,94,0.7);
  }

  /* Phone mockup on right side */
  .phone-preview {
    position: relative;
    width: 140px;
    height: 286px;
    flex-shrink: 0;
    margin-right: 40px;
  }
  .phone-preview .shell {
    position: absolute;
    inset: 0;
    border-radius: 24px;
    background: #E8530E;
    box-shadow: 0 0 0 1px #FF6B2B, 0 20px 60px rgba(0,0,0,0.5);
  }
  .phone-preview .screen {
    position: absolute;
    inset: 2px;
    border-radius: 22px;
    overflow: hidden;
    background: #fff;
  }
  .phone-preview .notch {
    position: absolute;
    top: 6px;
    left: 50%;
    transform: translateX(-50%);
    width: 46px;
    height: 14px;
    background: #000;
    border-radius: 10px;
    z-index: 10;
  }
  .phone-preview .screen img {
    position: absolute;
    top: 24px;
    left: 0;
    right: 0;
    bottom: 0;
    width: 100%;
    height: calc(100% - 24px);
    object-fit: cover;
    object-position: top;
  }
  .phone-preview .fade {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 40px;
    background: linear-gradient(to top, #fff, transparent);
    z-index: 5;
  }
</style>
</head>
<body>

<div class="banner">
  <div class="grid-pattern"></div>
  <div class="glow-1"></div>
  <div class="glow-2"></div>

  <!-- Köln Skyline -->
  <div class="skyline">
    <svg viewBox="0 0 1584 300" preserveAspectRatio="xMidYMax slice" fill="rgba(34,197,94,0.045)">
      <!-- Kölner Dom — prominent but subtle -->
      <!-- Linker Turm -->
      <polygon points="680,300 680,60 690,55 693,48 696,30 698,20 700,8 702,20 704,30 707,48 710,55 720,60 720,300" />
      <!-- Spitze linker Turm -->
      <rect x="698" y="0" width="4" height="10" />
      <!-- Rechter Turm -->
      <polygon points="740,300 740,65 750,60 753,52 756,35 758,24 760,12 762,24 764,35 767,52 770,60 780,65 780,300" />
      <!-- Spitze rechter Turm -->
      <rect x="758" y="4" width="4" height="10" />
      <!-- Mittelschiff -->
      <rect x="715" y="90" width="30" height="210" />
      <!-- Dachfirst Mittelschiff -->
      <polygon points="715,90 730,65 745,90" />
      <!-- Fensterbögen (dezent) -->
      <rect x="688" y="80" width="8" height="20" rx="4" fill="rgba(0,0,0,0.15)" />
      <rect x="700" y="80" width="8" height="20" rx="4" fill="rgba(0,0,0,0.15)" />
      <rect x="748" y="85" width="8" height="20" rx="4" fill="rgba(0,0,0,0.15)" />
      <rect x="760" y="85" width="8" height="20" rx="4" fill="rgba(0,0,0,0.15)" />
      <!-- Strebepfeiler -->
      <polygon points="672,300 675,120 680,115 680,300" />
      <polygon points="788,300 785,125 780,120 780,300" />

      <!-- Hohenzollernbrücke -->
      <path d="M 790,260 Q 850,230 920,260" stroke="rgba(34,197,94,0.045)" stroke-width="3" fill="none" />
      <path d="M 790,255 Q 850,225 920,255" stroke="rgba(34,197,94,0.045)" stroke-width="2" fill="none" />
      <rect x="790" y="258" width="130" height="42" />

      <!-- Colonius -->
      <rect x="480" y="120" width="5" height="180" />
      <ellipse cx="482" cy="140" rx="12" ry="8" />
      <rect x="481" y="70" width="3" height="55" />

      <!-- Kranhaus -->
      <polygon points="960,300 960,140 1000,100 1000,140 1020,140 1020,300" />

      <!-- Andere Gebäude (dezent) -->
      <rect x="380" y="210" width="40" height="90" />
      <rect x="430" y="190" width="25" height="110" />
      <rect x="1060" y="200" width="50" height="100" />
      <rect x="1120" y="220" width="35" height="80" />
      <rect x="1170" y="195" width="30" height="105" />
      <rect x="280" y="240" width="35" height="60" />
      <rect x="325" y="225" width="25" height="75" />
      <rect x="1250" y="215" width="45" height="85" />
      <rect x="1310" y="240" width="25" height="60" />
      <rect x="1370" y="230" width="35" height="70" />
      <rect x="200" y="255" width="30" height="45" />

      <!-- Rhein -->
      <rect x="0" y="285" width="1584" height="15" fill="rgba(34,197,94,0.02)" />
    </svg>
  </div>

  <div class="content">
    <div class="text-block">
      <div class="brand">bonuskarte<span class="dot">.digital</span></div>
      <div class="tagline">Die digitale Stempelkarte für Kölner Gastronomen.</div>
      <div class="badges">
        <span class="badge">Apple & Google Wallet</span>
        <span class="badge">Made in Köln</span>
        <span class="badge">DSGVO-konform</span>
      </div>
    </div>

    <div class="phone-preview">
      <div class="shell"></div>
      <div class="screen">
        <div class="notch"></div>
        <img src="/screens/screen-8.webp" alt="Goldjunge Köln">
        <div class="fade"></div>
      </div>
    </div>
  </div>
</div>

</body>
</html>
